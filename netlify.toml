# netlify.toml
# Configures Netlify server redirects and API proxies to match the Vite development server's middleware proxy routing.

# Build Settings and Environment
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# 1. Groq Proxy (via Serverless Function to preserve Authorization headers)
[[redirects]]
  from = "/api/groq/*"
  to = "/.netlify/functions/groq"
  status = 200
  force = true

# 2. Hugging Face Inference Proxy (via Serverless Function to preserve Authorization headers)
[[redirects]]
  from = "/api/huggingface/*"
  to = "/.netlify/functions/huggingface"
  status = 200
  force = true

# 3. Direct Hugging Face Text Inference Proxy (via Serverless Function to preserve Authorization headers)
[[redirects]]
  from = "/api/hf-text/*"
  to = "/.netlify/functions/hf-text"
  status = 200
  force = true

# 4. Pollinations Image Proxy (image.pollinations.ai - Public API, standard redirect ok)
[[redirects]]
  from = "/api/pollinations/*"
  to = "https://image.pollinations.ai/:splat"
  status = 200
  force = true
  headers = { Access-Control-Allow-Origin = "*" }

# 5. Gemini API Proxy (via Serverless Function for consistency and security)
[[redirects]]
  from = "/api/gemini/*"
  to = "/.netlify/functions/gemini"
  status = 200
  force = true

# 6. Single Page App (SPA) Fallback routing
# Forwards all other non-file requests to index.html for React Router compatibility.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

